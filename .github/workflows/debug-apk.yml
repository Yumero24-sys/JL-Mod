name: Debug APK (key test)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.6
        with:
          submodules: 'true'
      - name: set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Throwaway key so the APK is signed and installable (BB10 refuses unsigned APKs).
      - name: Create test signing key
        run: |
          keytool -genkeypair -keystore keystore.jks -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=keytest"
          printf 'keyAlias=key\nkeyPassword=android\nstoreFile=keystore.jks\nstorePassword=android\n' > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleEmulatorDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4.3.3
        with:
          name: JL-Mod-keytest
          path: app/build/outputs/apk/emulator/debug/*.apk